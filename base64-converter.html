<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free online Base64 Encoder and Decoder. Quickly encode text to Base64 or decode it back to readable string in your browser.">
    <meta name="theme-color" content="#ffffff">
    <title>Base64 Encoder & Decoder - Studora</title>
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        .tool-container {
            max-width: 1000px;
            margin: 40px auto 80px;
            padding: 0 20px;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .tool-header h1 {
            font-family: 'Manrope', sans-serif;
            font-size: clamp(28px, 5vw, 42px);
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .tool-header p {
            color: var(--muted);
            font-size: 16px;
        }

        .workspace {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(51, 35, 110, 0.04);
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 6px 15px rgba(101, 84, 223, 0.2);
        }

        .btn-secondary {
            background: #f1efff;
            color: var(--primary);
        }

        .btn-outline {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: #fbfaff;
            border-color: #d8d3f5;
        }

        .status-message {
            margin-left: auto;
            align-self: center;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            display: none;
        }

        .status-message.success {
            display: block;
            background: #e5f7ed;
            color: #166534;
        }

        .status-message.error {
            display: block;
            background: #ffeeee;
            color: #d32f2f;
        }

        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: 400px;
        }

        .editor-col {
            display: flex;
            flex-direction: column;
        }

        .editor-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        textarea {
            flex: 1;
            width: 100%;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.5;
            resize: none;
            background: #fbfaff;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
            overflow: auto;
        }

        textarea:focus {
            border-color: var(--primary);
            background: #ffffff;
        }

        #outputArea {
            background: #f4f4f9;
        }

        @media (max-width: 768px) {
            .editor-grid {
                grid-template-columns: 1fr;
                height: 700px;
            }
            .status-message {
                margin-left: 0;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            studora<span>.</span>
        </a>
        <nav aria-label="Main navigation">
            <a href="index.html#tools">Explore Tools</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main class="tool-container">
        <div class="tool-header">
            <h1>Base64 Encoder & Decoder</h1>
            <p>Easily encode text to Base64 or decode Base64 strings back to readable text.</p>
        </div>

        <div class="workspace">
            <div class="controls-row">
                <button class="btn btn-primary" id="encodeBtn">🔐 Encode to Base64</button>
                <button class="btn btn-secondary" id="decodeBtn">🔓 Decode to Text</button>
                <button class="btn btn-outline" id="clearBtn">🗑️ Clear</button>
                <div class="status-message" id="statusMessage"></div>
            </div>

            <div class="editor-grid">
                <div class="editor-col">
                    <div class="editor-label">Input</div>
                    <textarea id="inputArea" placeholder="Type or paste your text or Base64 string here..."></textarea>
                </div>
                
                <div class="editor-col">
                    <div class="editor-label">
                        <span>Output</span>
                        <button class="btn-outline" id="copyBtn" style="padding: 4px 10px; font-size: 11px; border-radius: 6px;">Copy</button>
                    </div>
                    <textarea id="outputArea" readonly placeholder="Result will appear here..."></textarea>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <a href="index.html" class="footer-logo">
            studora<span>.</span>
        </a>
        <p class="footer-tagline">Study smarter. Achieve more.</p>
        <nav class="footer-links" aria-label="Footer navigation">
            <a href="about.html">About Us</a>
            <a href="privacy.html">Privacy Policy</a>
            <a href="contact.html">Contact</a>
            <a href="terms.html">Terms of Use</a>
        </nav>
        <small class="copyright">
            © <span id="year"></span> Studora. All rights reserved.
        </small>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();

        const inputArea = document.getElementById('inputArea');
        const outputArea = document.getElementById('outputArea');
        const encodeBtn = document.getElementById('encodeBtn');
        const decodeBtn = document.getElementById('decodeBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const statusMessage = document.getElementById('statusMessage');

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status-message ${type}`;
            setTimeout(() => {
                statusMessage.className = 'status-message';
            }, 3000);
        }

        // UTF-8 Safe Encoding
        encodeBtn.addEventListener('click', () => {
            const rawText = inputArea.value;
            if (!rawText) {
                showStatus("Please enter text to encode.", "error");
                return;
            }
            try {
                const encoded = btoa(unescape(encodeURIComponent(rawText)));
                outputArea.value = encoded;
                showStatus("Encoded successfully!", "success");
            } catch (error) {
                outputArea.value = "";
                showStatus("Error encoding text.", "error");
            }
        });

        // UTF-8 Safe Decoding
        decodeBtn.addEventListener('click', () => {
            const base64Text = inputArea.value.trim();
            if (!base64Text) {
                showStatus("Please enter Base64 string to decode.", "error");
                return;
            }
            try {
                const decoded = decodeURIComponent(escape(atob(base64Text)));
                outputArea.value = decoded;
                showStatus("Decoded successfully!", "success");
            } catch (error) {
                outputArea.value = "";
                showStatus("Invalid Base64 string.", "error");
            }
        });

        clearBtn.addEventListener('click', () => {
            inputArea.value = '';
            outputArea.value = '';
            inputArea.focus();
        });

        copyBtn.addEventListener('click', () => {
            if (!outputArea.value) return;
            
            outputArea.select();
            navigator.clipboard.writeText(outputArea.value).then(() => {
                showStatus("Copied to clipboard!", "success");
            }).catch(() => {
                showStatus("Failed to copy", "error");
            });
        });
    </script>
</body>
</html>
