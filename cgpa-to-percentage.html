<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free online CGPA to Percentage converter. Convert your 10-point scale CGPA to a percentage instantly.">
    <meta name="theme-color" content="#ffffff">
    <title>CGPA to Percentage Converter - Studora</title>
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        .tool-container {
            max-width: 600px;
            margin: 40px auto 80px;
            padding: 0 20px;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .tool-header h1 {
            font-family: 'Manrope', sans-serif;
            font-size: clamp(28px, 5vw, 42px);
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .tool-header p {
            color: var(--muted);
            font-size: 16px;
        }

        .calculator-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 40px 30px;
            box-shadow: 0 8px 30px rgba(51, 35, 110, 0.04);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input, .input-group select {
            padding: 16px 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fbfaff;
            color: var(--text);
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(101, 84, 223, 0.1);
        }

        .result-box {
            background: #f1efff;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            margin-top: 35px;
            border: 1px dashed #d8d3f5;
        }

        .result-label {
            font-size: 14px;
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .result-value {
            font-family: 'Manrope', sans-serif;
            font-size: 48px;
            font-weight: 800;
            color: var(--text);
            line-height: 1.1;
        }

        .result-value span {
            font-size: 24px;
            color: var(--muted);
        }

        .formula-help {
            font-size: 13px;
            color: var(--muted);
            margin-top: 15px;
            text-align: center;
        }

    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            studora<span>.</span>
        </a>
        <nav aria-label="Main navigation">
            <a href="index.html#tools">Explore Tools</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main class="tool-container">
        <div class="tool-header">
            <h1>CGPA to Percentage</h1>
            <p>Quickly convert your 10-point scale CGPA into a standard percentage.</p>
        </div>

        <div class="calculator-box">
            
            <div class="input-group">
                <label for="cgpaInput">Enter your CGPA (out of 10)</label>
                <input type="number" id="cgpaInput" placeholder="e.g., 8.5" step="0.01" min="0" max="10">
            </div>

            <div class="input-group">
                <label for="formulaSelect">Conversion Formula</label>
                <select id="formulaSelect">
                    <option value="9.5">Multiply by 9.5 (Standard / CBSE)</option>
                    <option value="10">Multiply by 10 (Common University)</option>
                    <option value="aktu">(CGPA - 0.75) × 10 (Engineering / AKTU)</option>
                </select>
            </div>

            <div class="result-box">
                <div class="result-label">Your Percentage</div>
                <div class="result-value" id="percentageResult">0.00<span>%</span></div>
            </div>
            
            <p class="formula-help" id="formulaExplanation">Formula: CGPA × 9.5</p>

        </div>
    </main>

    <footer class="site-footer">
        <a href="index.html" class="footer-logo">
            studora<span>.</span>
        </a>
        <p class="footer-tagline">Study smarter. Achieve more.</p>
        <nav class="footer-links" aria-label="Footer navigation">
            <a href="about.html">About Us</a>
            <a href="privacy.html">Privacy Policy</a>
            <a href="contact.html">Contact</a>
            <a href="terms.html">Terms of Use</a>
        </nav>
        <small class="copyright">
            © <span id="year"></span> Studora. All rights reserved.
        </small>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();

        const cgpaInput = document.getElementById('cgpaInput');
        const formulaSelect = document.getElementById('formulaSelect');
        const percentageResult = document.getElementById('percentageResult');
        const formulaExplanation = document.getElementById('formulaExplanation');

        function calculatePercentage() {
            let cgpa = parseFloat(cgpaInput.value);
            const formula = formulaSelect.value;
            let percentage = 0;

            if (isNaN(cgpa) || cgpa < 0) {
                percentageResult.innerHTML = `0.00<span>%</span>`;
                return;
            }

            // Cap at 10 to avoid weird math
            if (cgpa > 10) cgpa = 10;

            if (formula === '9.5') {
                percentage = cgpa * 9.5;
                formulaExplanation.textContent = 'Formula used: CGPA × 9.5';
            } else if (formula === '10') {
                percentage = cgpa * 10;
                formulaExplanation.textContent = 'Formula used: CGPA × 10';
            } else if (formula === 'aktu') {
                percentage = (cgpa - 0.75) * 10;
                formulaExplanation.textContent = 'Formula used: (CGPA - 0.75) × 10';
            }

            // Make sure percentage doesn't go below 0 or above 100
            if (percentage < 0) percentage = 0;
            if (percentage > 100) percentage = 100;

            percentageResult.innerHTML = `${percentage.toFixed(2)}<span>%</span>`;
        }

        cgpaInput.addEventListener('input', calculatePercentage);
        formulaSelect.addEventListener('change', calculatePercentage);
    </script>
</body>
</html>
