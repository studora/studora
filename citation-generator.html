<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free online APA and MLA Citation Generator. Create accurate citations for your assignments and research papers instantly.">
    <meta name="theme-color" content="#ffffff">
    <title>Citation Generator - Studora</title>
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        .tool-container {
            max-width: 800px;
            margin: 40px auto 80px;
            padding: 0 20px;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .tool-header h1 {
            font-family: 'Manrope', sans-serif;
            font-size: clamp(28px, 5vw, 42px);
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .tool-header p {
            color: var(--muted);
            font-size: 16px;
        }

        .workspace {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 35px 30px;
            box-shadow: 0 8px 30px rgba(51, 35, 110, 0.04);
            margin-bottom: 30px;
        }

        .type-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--border);
        }

        .type-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border);
            background: transparent;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .type-btn.active {
            border-color: var(--primary);
            background: #f1efff;
            color: var(--primary);
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group.full-width {
            grid-column: 1 / -1;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            padding: 14px 18px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fbfaff;
            color: var(--text);
        }

        .input-group input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(101, 84, 223, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(101, 84, 223, 0.3);
            transition: transform 0.2s ease;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Results Box */
        .results-box {
            display: none;
            background: #fbfaff;
            border: 2px dashed var(--primary);
            border-radius: 18px;
            padding: 30px;
            margin-top: 30px;
        }

        .results-box.active {
            display: block;
        }

        .citation-item {
            margin-bottom: 25px;
        }

        .citation-item:last-child {
            margin-bottom: 0;
        }

        .citation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .citation-header h3 {
            font-size: 16px;
            color: var(--primary);
            margin: 0;
        }

        .btn-copy {
            background: #f1efff;
            color: var(--primary);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background: #e5e0fa;
        }

        .citation-text {
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: var(--text);
            padding: 15px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            /* Standard hanging indent for academic citations */
            padding-left: 30px;
            text-indent: -30px;
        }

        @media (max-width: 600px) {
            .input-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            studora<span>.</span>
        </a>
        <nav aria-label="Main navigation">
            <a href="index.html#tools">Explore Tools</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main class="tool-container">
        <div class="tool-header">
            <h1>Citation Generator</h1>
            <p>Generate perfectly formatted APA and MLA citations for your essays and assignments.</p>
        </div>

        <div class="workspace">
            <div class="type-selector">
                <button class="type-btn active" data-type="website">🌐 Website</button>
                <button class="type-btn" data-type="book">📚 Book</button>
            </div>

            <div class="input-grid">
                <div class="input-group">
                    <label for="firstName">Author First Name</label>
                    <input type="text" id="firstName" placeholder="e.g., John">
                </div>
                
                <div class="input-group">
                    <label for="lastName">Author Last Name</label>
                    <input type="text" id="lastName" placeholder="e.g., Doe">
                </div>

                <div class="input-group full-width">
                    <label for="title" id="titleLabel">Page/Article Title</label>
                    <input type="text" id="title" placeholder="Enter title here">
                </div>

                <div class="input-group website-only">
                    <label for="siteName">Website Name</label>
                    <input type="text" id="siteName" placeholder="e.g., Wikipedia, The New York Times">
                </div>

                <div class="input-group book-only" style="display: none;">
                    <label for="publisher">Publisher</label>
                    <input type="text" id="publisher" placeholder="e.g., Penguin Books">
                </div>

                <div class="input-group">
                    <label for="year">Year Published</label>
                    <input type="number" id="year" placeholder="e.g., 2023">
                </div>

                <div class="input-group full-width website-only">
                    <label for="url">URL</label>
                    <input type="url" id="url" placeholder="https://...">
                </div>
            </div>

            <button class="btn-primary" id="generateBtn">Generate Citations</button>

            <div class="results-box" id="resultsBox">
                <div class="citation-item">
                    <div class="citation-header">
                        <h3>APA Format (7th Ed.)</h3>
                        <button class="btn-copy" onclick="copyCitation('apaCitation')">Copy</button>
                    </div>
                    <div class="citation-text" id="apaCitation"></div>
                </div>

                <div class="citation-item">
                    <div class="citation-header">
                        <h3>MLA Format (9th Ed.)</h3>
                        <button class="btn-copy" onclick="copyCitation('mlaCitation')">Copy</button>
                    </div>
                    <div class="citation-text" id="mlaCitation"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <a href="index.html" class="footer-logo">
            studora<span>.</span>
        </a>
        <p class="footer-tagline">Study smarter. Achieve more.</p>
        <nav class="footer-links" aria-label="Footer navigation">
            <a href="about.html">About Us</a>
            <a href="privacy.html">Privacy Policy</a>
            <a href="contact.html">Contact</a>
            <a href="terms.html">Terms of Use</a>
        </nav>
        <small class="copyright">
            © <span id="year"></span> Studora. All rights reserved.
        </small>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();

        let currentType = 'website';
        const typeBtns = document.querySelectorAll('.type-btn');
        
        const firstNameInput = document.getElementById('firstName');
        const lastNameInput = document.getElementById('lastName');
        const titleInput = document.getElementById('title');
        const siteNameInput = document.getElementById('siteName');
        const publisherInput = document.getElementById('publisher');
        const yearInput = document.getElementById('year');
        const urlInput = document.getElementById('url');
        
        const titleLabel = document.getElementById('titleLabel');
        const websiteFields = document.querySelectorAll('.website-only');
        const bookFields = document.querySelectorAll('.book-only');
        
        const generateBtn = document.getElementById('generateBtn');
        const resultsBox = document.getElementById('resultsBox');
        const apaCitation = document.getElementById('apaCitation');
        const mlaCitation = document.getElementById('mlaCitation');

        // Switch between Website and Book form fields
        typeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                typeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.getAttribute('data-type');
                
                if (currentType === 'website') {
                    titleLabel.textContent = 'Page/Article Title';
                    websiteFields.forEach(el => el.style.display = 'flex');
                    bookFields.forEach(el => el.style.display = 'none');
                } else {
                    titleLabel.textContent = 'Book Title';
                    websiteFields.forEach(el => el.style.display = 'none');
                    bookFields.forEach(el => el.style.display = 'flex');
                }
                
                resultsBox.classList.remove('active');
            });
        });

        generateBtn.addEventListener('click', () => {
            const first = firstNameInput.value.trim();
            const last = lastNameInput.value.trim();
            const title = titleInput.value.trim();
            const year = yearInput.value.trim() || 'n.d.'; // n.d. = no date
            
            if (!title) {
                alert("Please enter a title to generate the citation.");
                return;
            }

            let apaHTML = '';
            let mlaHTML = '';

            // Format Author Names
            let apaAuthor = last ? `${last}, ${first ? first.charAt(0) + '.' : ''}` : '';
            let mlaAuthor = last ? `${last}${first ? ', ' + first : ''}.` : '';

            if (currentType === 'website') {
                const siteName = siteNameInput.value.trim();
                const url = urlInput.value.trim();

                // APA Website: Last, F. M. (Year). Title of page. Site Name. URL
                apaHTML = `${apaAuthor ? apaAuthor + ' ' : ''}(${year}). <i>${title}</i>. ${siteName ? siteName + '. ' : ''}${url}`;
                
                // MLA Website: Last, First. "Title of Page." Site Name, Date, URL.
                mlaHTML = `${mlaAuthor ? mlaAuthor + ' ' : ''}"${title}." <i>${siteName}</i>, ${year !== 'n.d.' ? year + ', ' : ''}${url}.`;

            } else {
                const publisher = publisherInput.value.trim();

                // APA Book: Last, F. M. (Year). Title of book. Publisher.
                apaHTML = `${apaAuthor ? apaAuthor + ' ' : ''}(${year}). <i>${title}</i>. ${publisher}`;
                
                // MLA Book: Last, First. Title of Book. Publisher, Year.
                mlaHTML = `${mlaAuthor ? mlaAuthor + ' ' : ''}<i>${title}</i>. ${publisher ? publisher + ', ' : ''}${year}.`;
            }

            apaCitation.innerHTML = apaHTML;
            mlaCitation.innerHTML = mlaHTML;
            
            resultsBox.classList.add('active');
            resultsBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });

        window.copyCitation = function(elementId) {
            const textToCopy = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("Citation copied to clipboard!");
            });
        }
    </script>
</body>
</html>
