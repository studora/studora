<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free online Secure Password Generator. Create strong, random passwords instantly in your browser.">
    <meta name="theme-color" content="#ffffff">
    <title>Secure Password Generator - Studora</title>
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        .tool-container {
            max-width: 600px;
            margin: 40px auto 80px;
            padding: 0 20px;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .tool-header h1 {
            font-family: 'Manrope', sans-serif;
            font-size: clamp(28px, 5vw, 42px);
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .tool-header p {
            color: var(--muted);
            font-size: 16px;
        }

        .generator-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 35px 30px;
            box-shadow: 0 8px 30px rgba(51, 35, 110, 0.04);
        }

        .password-display {
            background: #fbfaff;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            transition: border-color 0.3s;
        }

        .password-display.copied {
            border-color: #248753;
            background: #e5f7ed;
        }

        #passwordResult {
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            word-break: break-all;
            flex: 1;
        }

        .copy-btn {
            background: #f1efff;
            color: var(--primary);
            border: none;
            border-radius: 8px;
            width: 45px;
            height: 45px;
            display: grid;
            place-items: center;
            cursor: pointer;
            font-size: 20px;
            transition: background 0.2s;
            margin-left: 15px;
        }

        .copy-btn:hover {
            background: #e5e0fa;
        }

        .setting-group {
            margin-bottom: 25px;
        }

        .length-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #lengthValue {
            color: var(--primary);
            font-size: 18px;
            font-weight: 800;
        }

        /* Custom Range Slider */
        input[type=range] {
            width: 100%;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: background 0.2s;
        }

        .checkbox-label:hover {
            background: #fbfaff;
        }

        .checkbox-label input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(101, 84, 223, 0.3);
            transition: transform 0.2s ease;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        @media (max-width: 600px) {
            .checkbox-grid {
                grid-template-columns: 1fr;
            }
            #passwordResult {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            studora<span>.</span>
        </a>
        <nav aria-label="Main navigation">
            <a href="index.html#tools">Explore Tools</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main class="tool-container">
        <div class="tool-header">
            <h1>Secure Password Generator</h1>
            <p>Generate highly secure, random passwords instantly. Processed locally on your device.</p>
        </div>

        <div class="generator-box">
            
            <div class="password-display" id="passwordContainer">
                <div id="passwordResult">Click generate...</div>
                <button class="copy-btn" id="copyBtn" title="Copy Password">📋</button>
            </div>

            <div class="setting-group">
                <div class="length-header">
                    <span>Password Length</span>
                    <span id="lengthValue">16</span>
                </div>
                <input type="range" id="lengthSlider" min="8" max="32" value="16">
            </div>

            <div class="checkbox-grid">
                <label class="checkbox-label">
                    <input type="checkbox" id="chkUpper" checked>
                    Uppercase (A-Z)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="chkLower" checked>
                    Lowercase (a-z)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="chkNumbers" checked>
                    Numbers (0-9)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="chkSymbols" checked>
                    Symbols (!@#$%)
                </label>
            </div>

            <button class="btn-primary" id="generateBtn">🔄 Generate Password</button>
        </div>
    </main>

    <footer class="site-footer">
        <a href="index.html" class="footer-logo">
            studora<span>.</span>
        </a>
        <p class="footer-tagline">Study smarter. Achieve more.</p>
        <nav class="footer-links" aria-label="Footer navigation">
            <a href="about.html">About Us</a>
            <a href="privacy.html">Privacy Policy</a>
            <a href="contact.html">Contact</a>
            <a href="terms.html">Terms of Use</a>
        </nav>
        <small class="copyright">
            © <span id="year"></span> Studora. All rights reserved.
        </small>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();

        const passwordResult = document.getElementById('passwordResult');
        const lengthSlider = document.getElementById('lengthSlider');
        const lengthValue = document.getElementById('lengthValue');
        const copyBtn = document.getElementById('copyBtn');
        const passwordContainer = document.getElementById('passwordContainer');
        const generateBtn = document.getElementById('generateBtn');

        const chkUpper = document.getElementById('chkUpper');
        const chkLower = document.getElementById('chkLower');
        const chkNumbers = document.getElementById('chkNumbers');
        const chkSymbols = document.getElementById('chkSymbols');

        const chars = {
            upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
            lower: "abcdefghijklmnopqrstuvwxyz",
            numbers: "0123456789",
            symbols: "!@#$%^&*()_+~`|}{[]:;?><,./-="
        };

        // Update length display
        lengthSlider.addEventListener('input', () => {
            lengthValue.textContent = lengthSlider.value;
            generatePassword();
        });

        function generatePassword() {
            let allowedChars = "";
            let generatedPassword = "";

            if (chkUpper.checked) allowedChars += chars.upper;
            if (chkLower.checked) allowedChars += chars.lower;
            if (chkNumbers.checked) allowedChars += chars.numbers;
            if (chkSymbols.checked) allowedChars += chars.symbols;

            if (allowedChars.length === 0) {
                passwordResult.textContent = "Select an option!";
                return;
            }

            const length = parseInt(lengthSlider.value);
            
            // Use cryptographic randomizer for true randomness
            const array = new Uint32Array(length);
            window.crypto.getRandomValues(array);

            for (let i = 0; i < length; i++) {
                generatedPassword += allowedChars[array[i] % allowedChars.length];
            }

            passwordResult.textContent = generatedPassword;
            passwordContainer.classList.remove('copied'); // reset border
        }

        // Generate on button click and on checkbox change
        generateBtn.addEventListener('click', generatePassword);
        [chkUpper, chkLower, chkNumbers, chkSymbols].forEach(chk => {
            chk.addEventListener('change', generatePassword);
        });

        // Copy to clipboard
        copyBtn.addEventListener('click', () => {
            if (passwordResult.textContent === "Click generate..." || passwordResult.textContent === "Select an option!") return;

            navigator.clipboard.writeText(passwordResult.textContent).then(() => {
                passwordContainer.classList.add('copied');
                setTimeout(() => {
                    passwordContainer.classList.remove('copied');
                }, 2000);
            });
        });

        // Generate one immediately on load
        generatePassword();
    </script>
</body>
</html>
